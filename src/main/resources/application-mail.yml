spring:
  mail:
    host: ${TICKMEET_SMTP_HOST}
    port: ${TICKMEET_SMTP_PORT:587}
    username: ${TICKMEET_SMTP_USER}
    password: ${TICKMEET_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
tickmeet:
  mail-from: ${TICKMEET_MAIL_FROM}
